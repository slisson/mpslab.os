# Conventional Commits rules for every commit in a PR (see .github/workflows/pr-lint.yml).
# Types are kept in sync with release-please-config.json so the changelog,
# which is generated from these commit messages, stays consistent.
extends:
  - '@commitlint/config-conventional'
rules:
  type-enum:
    - 2
    - always
    - - feat
      - fix
      - perf
      - refactor
      - docs
      - build
      - ci
      - test
      - style
      - chore
      - revert
  subject-empty:
    - 2
    - never
  subject-case:
    - 2
    - never
    - - upper-case
      - pascal-case
      - start-case
  # Allow long lines in the body and footer (URLs, log excerpts, trailers).
  body-max-line-length:
    - 0
  footer-max-line-length:
    - 0
