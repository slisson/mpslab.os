name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The MPS workers run on the JDK the distribution targets — Java 21 for 2026.1, whose
      # platform classes are class-file major 65. Running Gradle on that JDK means the
      # toolchain resolves to it and nothing has to be provisioned; a build overriding
      # -PmpsVersion falls back to the foojay resolver configured in settings.gradle.kts.
      - name: Set up JDK 21
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '21'

      # The generated TypeScript is compiled with tsc and run with node's own test runner
      # (`node --test`), so the job needs a Node as well as a JDK. 22 is the floor: the
      # test runner only accepts glob patterns for test files from 22.0.
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mps-typescript/package-lock.json

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # Caches the Gradle user home, which is what keeps the ~700 MB MPS archive from being
      # downloaded again. The unpacked distribution is deliberately not cached on top of
      # that: the extracted tree is a few GB, and restoring it costs about what unpacking
      # the cached archive does.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The editor tests boot a real MPS editor, and the IDE platform initialises AWT for
      # real rather than headlessly — -Djava.awt.headless=true is not enough. With no X
      # server on the runner, AWT falls back to X11GraphicsEnvironment and the launcher dies
      # before it runs anything: "Can't connect to X11 window server using ':0.0'". Xvfb is
      # a display for it to connect to; nothing is ever shown.
      - name: Ensure Xvfb is available
        run: which xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)

      - name: Build
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" ./gradlew build --stacktrace

      # Everything below runs on what the step above generated: `mps-typescript` is an npm
      # project whose sources are the modules' source_gen. `tsc --strict` is the ground
      # truth for whether the language emits well-typed TypeScript; `node --test` then runs
      # the TSTestCase roots of test.ex.de.q60.mps.lang.typescript, which have become
      # `describe`/`test` blocks over node:assert.
      - name: Install the TypeScript toolchain
        run: npm ci
        working-directory: mps-typescript

      - name: Compile and run the generated TypeScript
        run: npm test
        working-directory: mps-typescript

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

      # The MPS generator's own log, which is where a failed generation explains itself.
      - name: Upload the MPS worker logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: mps-worker-logs
          path: '**/build/tmp/*/log/'
          if-no-files-found: ignore
