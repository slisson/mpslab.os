name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The MPS workers run on the JDK the distribution targets — Java 21 for 2026.1, whose
      # platform classes are class-file major 65. Running Gradle on that JDK means the
      # toolchain resolves to it and nothing has to be provisioned; a build overriding
      # -PmpsVersion falls back to the foojay resolver configured in settings.gradle.kts.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      # Caches the Gradle user home, which is what keeps the ~700 MB MPS archive from being
      # downloaded again. The unpacked distribution is deliberately not cached on top of
      # that: the extracted tree is a few GB, and restoring it costs about what unpacking
      # the cached archive does.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

      # The MPS generator's own log, which is where a failed generation explains itself.
      - name: Upload the MPS worker logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: mps-worker-logs
          path: '**/build/tmp/*/log/'
          if-no-files-found: ignore
