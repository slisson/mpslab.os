name: Release (manual tag)

# Automated releases are driven by release-please.yml (Conventional Commits).
# This workflow is the manual fallback: push a `v*` tag by hand to build and
# release that exact version. release-please tags are created with the default
# GITHUB_TOKEN and therefore do NOT trigger this workflow, so there is no
# double-release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Releases run off a tag, not the default branch; reuse the cache the
          # build workflow wrote rather than adding an entry per tag.
          cache-read-only: true

      - name: Derive version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build -Pversion=${{ steps.version.outputs.version }} --stacktrace

      # No artifact is attached: the languages are generated rather than packaged. Add the
      # built files as trailing arguments once a packaging task exists.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
