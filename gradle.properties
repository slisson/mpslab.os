# Dependency versions live in gradle/libs.versions.toml. The MPS distribution is downloaded
# from the itemis Maven repository and extracted once under the root build/ (shared by all
# subprojects). To override without editing the catalog, pass -PmpsVersion=..., or point at
# an already-extracted copy with -PmpsHome=/path/to/MPS.

# The MPS generator worker runs in a forked JVM with -Xmx2g of its own; this is only for
# the Gradle daemon.
org.gradle.jvmargs=-Xmx2g
org.gradle.parallel=true

# The Kotlin stdlib is provided by MPS at runtime (and on the compile classpath via the
# bundled kotlin-stdlib), so don't let the Kotlin plugin add its own from Maven.
kotlin.stdlib.default.dependency=false
